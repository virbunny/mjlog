name: Generate PWA icons

on:
  workflow_dispatch:
  push:
    paths:
      - icon.svg
      - .github/workflows/generate-icons.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Generate PNG icons
        run: |
          python -m pip install --disable-pip-version-check cairosvg
          python - <<'PY'
          import cairosvg, pathlib
          pathlib.Path('icons').mkdir(exist_ok=True)
          cairosvg.svg2png(url='icon.svg', write_to='icons/icon-192.png', output_width=192, output_height=192)
          cairosvg.svg2png(url='icon.svg', write_to='icons/icon-512.png', output_width=512, output_height=512)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icons/icon-192.png icons/icon-512.png
          git diff --cached --quiet && exit 0
          git commit -m "Generate PWA PNG icons"
          git push
